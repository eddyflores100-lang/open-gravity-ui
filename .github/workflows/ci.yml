name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: open-gravity-ui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-lockfile:
    name: Refresh npm lockfile
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Resolve declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply non-breaking dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Commit lockfile if changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate npm lockfile"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi

  validate:
    name: Validate (Node ${{ matrix.node-version }})
    needs: [prepare-lockfile]
    if: always() && needs.prepare-lockfile.result != 'failure' && needs.prepare-lockfile.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: TypeScript validation
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Simulation tests
        run: npm run test
      - name: Production build
        run: npm run build
